name: 问题反馈
description: 报告无法使用、显示错误或异常退出
body:
  - type: markdown
    attributes:
      value: 请不要上传账号、密码、Cookie、令牌或未遮挡的个人成绩。
  - type: input
    id: version
    attributes:
      label: 应用版本和系统版本
      placeholder: 例如 beta0.9.0 安装版，Windows 11
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 如何遇到问题
      description: 写出操作步骤、预期结果和实际结果。学校业务请说明在校内还是校外，不要提供账号。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 错误提示或截图
      description: 截图前请遮挡个人信息；没有截图也可以直接描述提示文字。
